# Прогон тестов на каждый push и pull request.
#
# ЗАЧЕМ. Над проектом работает несколько помощников, правки прилетают в разные
# ветки и сходятся слиянием. Без прогона на стороне сервиса «у меня работало»
# остаётся единственным доказательством, а платёжный модуль и математика
# кейсов такого доказательства не выдерживают.
name: Тесты

on:
  push:
  pull_request:

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: У зависимостей нет известных уязвимостей
        run: npm audit --audit-level=low

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Тесты ходят в приложение как разработчик: подписи Telegram в CI взять
      # неоткуда. В продакшене DEV_MODE обязан быть выключен.
      DEV_MODE: 'true'
      ADMIN_TG_IDS: '999000001'
      # Ключ шифрования номеров карт: одноразовый, только для этого прогона.
      PAYOUT_DATA_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      DB_PATH: './data/ci.db'
      # Тесты шлют запросы вплотную, без пауз на анимацию, и на человеческих
      # порогах упёрлись бы в собственный ограничитель частоты.
      RATE_LIMIT_PLAY: '100000'
      RATE_LIMIT_READ: '100000'
      RATE_LIMIT_CASHIER: '100000'
      RATE_LIMIT_GUESS: '100000'
      RATE_LIMIT_AUTH: '100000'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Браузер для проверок интерфейса
        run: npx playwright install --with-deps chromium

      # Математика, удвоители и платежи сервера не требуют.
      - name: Математика кейсов и игр
        run: npm run verify

      - name: Удвоители
        run: npm run test:x2

      - name: Ограничитель частоты
        run: npm run test:ratelimit

      - name: Вход на сайт
        run: npm run test:auth

      - name: Служебный бот
        run: npm run test:ops

      - name: Отыгрыш и бонусный счёт
        run: npm run test:wager

      - name: Бесплатный кейс «Начало»
        run: npm run test:start-case

      - name: Рассылка бота
        run: npm run test:broadcast

      - name: Партнёрская программа и сверка с Sicilia
        run: npm run test:partners

      - name: Безопасное открытие CSV в таблицах
        run: node test/csv-security.mjs

      - name: Проверка заявок на вывод
        run: npm run test:payout-check

      - name: Шлюз Sicilia и споры по пополнениям
        run: npm run test:sicilia

      - name: Запуск сервера
        run: |
          node server/app.js > server.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000/api/config > /dev/null && exit 0
            sleep 1
          done
          echo "Сервер не поднялся:"; cat server.log; exit 1

      - name: Проверки API
        run: npm run test:api

      - name: Каталог казино и быстрые переходы
        run: npm run test:casino

      - name: Кеш рисунков и обложек
        run: npm run test:art && npm run test:casino-covers

      - name: Стабильность интерфейса при обновлениях
        run: npm run test:performance-ui

      - name: Первый заход, вход из кассы и касание кейсов
        run: npm run test:startup-ui

      - name: Касса, загрузчик и закреплённые вкладки
        run: npm run test:cashier-ui

      - name: Проверки интерфейса
        run: npm run test:ui

      - name: Автономная сборка
        run: npm run demo

      - name: Проверки интерфейса по автономной сборке
        run: node test/ui.mjs "file://$PWD/dist/luckybox.html"

      - name: Резервное копирование работает
        run: node deploy/backup.mjs

      - name: Логи сервера при падении
        if: failure()
        run: cat server.log || true

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEV_MODE: 'true'
      ADMIN_TG_IDS: '999000001'
      PAYOUT_DATA_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      DB_PATH: './data/quality-ci.db'
      RATE_LIMIT_READ: '100000'
      RATE_LIMIT_AUTH: '100000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Запуск отдельного тестового сервера
        run: |
          mkdir -p data artifacts
          node server/app.js > quality-server.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000/api/health > /dev/null && exit 0
            sleep 1
          done
          cat quality-server.log
          exit 1
      - name: Мобильная сетка мини-игр и Live казино
        run: node test/casino-layout.mjs http://localhost:3000
      - name: Замер интерфейса при CPU x4
        timeout-minutes: 2
        if: success() || failure()
        run: node tools/perf-audit.mjs http://localhost:3000 artifacts/performance.json
      - name: Безопасность HTTP с выключенным DEV_MODE
        if: success() || failure()
        run: |
          DEV_MODE=false DB_PATH=./data/security-ci.db PORT=3099 HOST=127.0.0.1 node server/app.js > security-server.log 2>&1 &
          security_pid=$!
          trap 'kill "$security_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3099/api/health > /dev/null; then
              node test/security-http.mjs http://127.0.0.1:3099
              exit $?
            fi
            sleep 1
          done
          cat security-server.log
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-quality-results
          path: artifacts/
      - name: Логи тестовых серверов при падении
        if: failure()
        run: cat quality-server.log security-server.log || true
