# nginx перед LuckyBox.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/luckybox
#   sudo ln -s /etc/nginx/sites-available/luckybox /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сертификат ставится до этого, командой:
#   sudo certbot --nginx -d ваш-домен.ru
# Certbot допишет пути к сертификату сам; блок ниже уже готов под его строки.
#
# Заменить надо одно: ваш-домен.ru в трёх местах.

# Ограничение частоты на входе. Приложение считает по игроку, а nginx - по
# адресу, и это разные задачи: приложение защищает игровую логику, nginx -
# сам процесс от потока, до которого приложению лучше не доходить.
limit_req_zone $binary_remote_addr zone=luckybox_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ваш-домен.ru;

    # Единственное, что остаётся на 80 порту, - подтверждение сертификата.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ваш-домен.ru;

    # --- Сертификат (строки допишет certbot) ---
    # ssl_certificate     /etc/letsencrypt/live/ваш-домен.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ваш-домен.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Заголовки безопасности ---
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Мини-апп открывается внутри Telegram, поэтому запрещать фреймы совсем
    # нельзя - Telegram показывает страницу именно во фрейме.
    add_header X-Frame-Options "ALLOW-FROM https://web.telegram.org" always;

    # Загрузки в поддержку идут телом запроса в base64, отсюда запас.
    client_max_body_size 12m;

    # Ответы приложения сжимаются; картинки уже сжаты, их трогать не надо.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Поток событий о платежах ────────────────────────────────────────────
    #
    # ЭТОТ БЛОК ОБЯЗАТЕЛЕН. Server-Sent Events - это ответ, который никогда не
    # заканчивается: сервер держит соединение и дописывает в него события.
    # nginx по умолчанию копит ответ в буфере и отдаёт клиенту целиком, а
    # значит не отдаст никогда: игрок оплатит и не увидит зачисления, пока не
    # перезагрузит страницу. Плюс обычный таймаут в 60 секунд рвал бы поток
    # каждую минуту.
    location /api/payments/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # Приложение шлёт keepalive раз в 25 секунд; таймаут заведомо больше.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding off;
    }

    # ── Приём SMS от платёжного шлюза ───────────────────────────────────────
    #
    # Отдельно от остального API: у телефона со шлюзом свой ритм, и общий
    # лимит по адресу ему мешать не должен. Тело подписано HMAC, приложение
    # проверяет подпись по точному JSON, поэтому ничего не переписываем.
    location /api/webhooks/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Остальное API ───────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=luckybox_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Страница и статика ──────────────────────────────────────────────────
    #
    # Раздаёт по-прежнему приложение: обложек под семьдесят кейсов, они лежат
    # рядом с кодом, и разносить их по двум местам значит однажды выложить
    # новую версию с чужими картинками.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
