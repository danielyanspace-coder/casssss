# nginx перед LuckyBox.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/luckybox
#   sudo ln -s /etc/nginx/sites-available/luckybox /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сертификат выпускается до этого конфига (deploy/install.sh делает это сам
# через временный конфиг на 80 порту): без сертификата nginx этот не примет.
#
# Заменить надо одно: ваш-домен.ru (install.sh подставляет сам).

# Ограничение частоты на входе. Приложение считает по игроку, а nginx - по
# адресу, и это разные задачи: приложение защищает игровую логику, nginx -
# сам процесс от потока, до которого приложению лучше не доходить.
limit_req_zone $binary_remote_addr zone=luckybox_api:10m rate=20r/s;
# Отдельная зона для краша: его опрос не должен съедать лимит остального API.
limit_req_zone $binary_remote_addr zone=luckybox_crash:10m rate=80r/s;
# Сколько соединений с потоком событий держит один адрес: поток не
# заканчивается, и без потолка один аккаунт занял бы все соединения nginx.
limit_conn_zone $binary_remote_addr zone=luckybox_sse:10m;

server {
    listen 80;
    listen [::]:80;
    server_name ваш-домен.ru;

    # Единственное, что остаётся на 80 порту, - подтверждение сертификата.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # http2 в строке listen, а не директивой «http2 on»: та появилась в nginx
    # 1.25, а в Ubuntu 22.04 и 24.04 стоят 1.18 и 1.24, и конфиг не прошёл бы
    # проверку. На новых nginx эта запись даёт лишь предупреждение.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ваш-домен.ru;

    # --- Сертификат ---
    # Выпускается до того, как этот конфиг включают (deploy/install.sh):
    # «listen ssl» без сертификата nginx не принимает вовсе.
    ssl_certificate     /etc/letsencrypt/live/ваш-домен.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ваш-домен.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Заголовки безопасности ---
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Сайт не должен открываться во фрейме чужой страницы: иначе поверх
    # кнопки «Вывести» кладут прозрачную приманку. Раньше здесь было
    # исключение для web.telegram.org - его требовал мини-апп.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Загрузки в поддержку идут телом запроса в base64, отсюда запас.
    client_max_body_size 12m;

    # Ответы приложения сжимаются; картинки уже сжаты, их трогать не надо.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Поток событий о платежах ────────────────────────────────────────────
    #
    # ЭТОТ БЛОК ОБЯЗАТЕЛЕН. Server-Sent Events - это ответ, который никогда не
    # заканчивается: сервер держит соединение и дописывает в него события.
    # nginx по умолчанию копит ответ в буфере и отдаёт клиенту целиком, а
    # значит не отдаст никогда: игрок оплатит и не увидит зачисления, пока не
    # перезагрузит страницу. Плюс обычный таймаут в 60 секунд рвал бы поток
    # каждую минуту.
    location /api/payments/events {
        limit_conn luckybox_sse 10;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # Приложение шлёт keepalive раз в 25 секунд; таймаут заведомо больше.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding off;
    }

    # ── Колбэки платёжных шлюзов (Sicilia, Heleket) ─────────────────────────
    #
    # Отдельно от остального API: колбэки всех игроков приходят с нескольких
    # адресов шлюза, и общий лимит по адресу им мешать не должен. Подпись и
    # адреса проверяет приложение, тело не переписываем.
    location /api/webhooks/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Кошелёк казино: вызовы агрегатора ───────────────────────────────────
    #
    # ЭТОТ БЛОК ОБЯЗАТЕЛЕН. Каждая ставка и каждый выигрыш каждого игрока
    # приходят сюда всего с двух адресов агрегатора. Под общим limit_req
    # ниже они упёрлись бы в лимит «на адрес» с первым десятком игроков, и
    # nginx отвечал бы 429 на начисление выигрыша. Защита здесь своя: адреса
    # агрегатора и ключ агента проверяет приложение (CASINO_CALLBACK_IPS).
    location = /api/casino/wallet {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Краш ────────────────────────────────────────────────────────────────
    #
    # Клиент краша спрашивает состояние раунда несколько раз в секунду, и
    # три-четыре игрока за одним мобильным адресом упирались бы в общий
    # лимит по адресу, вплоть до отказа на «Забрать». Частоту здесь держит
    # приложение - по игроку, а не по адресу.
    location /api/crash/ {
        limit_req zone=luckybox_crash burst=160 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Остальное API ───────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=luckybox_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Страница и статика ──────────────────────────────────────────────────
    #
    # Раздаёт по-прежнему приложение: обложек под семьдесят кейсов, они лежат
    # рядом с кодом, и разносить их по двум местам значит однажды выложить
    # новую версию с чужими картинками.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
