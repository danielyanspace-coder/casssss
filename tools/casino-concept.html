<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Казино · лобби провайдера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
  /*
   * Цвета и шрифты те же, что в приложении (public/styles.css): тёмная
   * фиолетовая подложка, розовый и золотой акценты, Unbounded в заголовках и
   * Manrope в тексте. Лобби должно читаться частью LUCKYBOX, а не вставкой
   * чужого сайта.
   */
  :root {
    --bg: #0d0716;
    --panel: #170d24;
    --panel-2: #1f1230;
    --line: rgba(255, 255, 255, 0.08);
    --text: #f4efff;
    --muted: #9c8db8;
    --pink: #ec4899;
    --violet: #8b5cf6;
    --gold: #ffd34d;
    /* Плитка 3:4. Размер задаёт сетка, а не картинка: на телефоне три в
       ряд, на компьютере столько, сколько влезает по 150-170 точек. */
    --tile-min: 150px;
    --gap: 12px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(120% 60% at 50% -10%, #2a0f45 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text);
    font: 500 14px/1.4 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  button { font: inherit; color: inherit; }

  /* ---------- Полоса согласования (не часть продукта) ---------- */
  .review {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px;
    background: rgba(13, 7, 22, 0.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .review b { font: 800 13px/1.2 'Unbounded', 'Manrope', sans-serif; letter-spacing: .02em; }
  .review small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); }
  .seg button {
    border: 0; background: none; cursor: pointer; padding: 7px 14px; border-radius: 999px;
    font-weight: 700; font-size: 13px; color: var(--muted);
  }
  /* На самом телефоне рамка телефона не нужна: страница и так в его ширину. */
  @media (max-width: 600px) { .seg { display: none; } }
  .seg button[aria-pressed="true"] { background: linear-gradient(135deg, var(--pink), var(--violet)); color: #fff; }

  /* ---------- Рамка: телефон или вся ширина ---------- */
  .stage { padding: 20px 16px 40px; }
  .device {
    margin: 0 auto; max-width: 1240px;
    container-type: inline-size;
  }
  body.is-phone .device {
    max-width: 390px; border-radius: 34px; overflow: hidden;
    border: 8px solid #221632;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);
    background: var(--bg);
  }

  /* ---------- Продукт ---------- */
  .app { background: transparent; }
  body.is-phone .app { background: radial-gradient(120% 50% at 50% -10%, #2a0f45 0%, var(--bg) 60%); }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  .brand { font: 800 16px/1 'Unbounded', 'Manrope', sans-serif; letter-spacing: .02em; }
  .brand span { color: var(--pink); }
  .balance {
    padding: 8px 12px; border-radius: 12px; font-weight: 800;
    background: var(--panel-2); border: 1px solid var(--line);
  }
  .content { padding: 14px 16px 28px; }

  .crumbs { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; font-weight: 600; }
  .crumbs i { font-style: normal; opacity: .5; }
  .crumbs b { color: var(--text); font-weight: 700; }

  .hero {
    position: relative; overflow: hidden;
    margin-top: 12px; padding: 18px; border-radius: 18px;
    background:
      radial-gradient(90% 140% at 100% 0%, rgba(236, 72, 153, 0.28), transparent 60%),
      radial-gradient(70% 120% at 0% 100%, rgba(139, 92, 246, 0.3), transparent 60%),
      var(--panel);
    border: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px;
  }
  /* Знак провайдера - наша монограмма буквами, а не их товарный знак:
     ставить чужой логотип без договора нельзя (см. CLAUDE.md, партнёры). */
  .mono {
    flex: 0 0 auto; width: 56px; height: 56px; border-radius: 16px;
    display: grid; place-items: center;
    font: 800 18px/1 'Unbounded', 'Manrope', sans-serif;
    background: linear-gradient(145deg, #2c1a44, #120a1c);
    box-shadow: inset 0 0 0 1px rgba(255, 211, 77, 0.35), 0 8px 18px rgba(0, 0, 0, 0.4);
    color: var(--gold);
  }
  .hero h1 { margin: 0; font: 800 20px/1.15 'Unbounded', 'Manrope', sans-serif; }
  .hero p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .hero .rtp {
    margin-left: auto; flex: 0 0 auto; text-align: right;
    font-size: 11px; color: var(--muted); font-weight: 700; line-height: 1.3;
  }
  .hero .rtp b { display: block; font: 800 20px/1 'Unbounded', 'Manrope', sans-serif; color: var(--gold); }

  .tools { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .search {
    flex: 1 1 220px; display: flex; align-items: center; gap: 8px;
    padding: 0 12px; height: 42px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line);
  }
  .search svg { flex: 0 0 auto; opacity: .55; }
  .search input {
    flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none;
    color: var(--text); font: 600 14px 'Manrope', sans-serif;
  }
  .search input::placeholder { color: var(--muted); }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; height: 42px; padding: 0 14px; border-radius: 12px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line);
    font-weight: 700; font-size: 13px; color: var(--muted);
  }
  .chip[aria-pressed="true"] { color: #fff; border-color: rgba(236, 72, 153, 0.55); background: rgba(236, 72, 153, 0.14); }

  .count-line { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 10px; }
  .count-line h2 { margin: 0; font: 800 15px/1 'Unbounded', 'Manrope', sans-serif; }
  .count-line span { color: var(--muted); font-size: 12px; font-weight: 700; }

  /*
   * Сетка. Плитки не тянутся на всю строку: у колонки есть нижний предел, и
   * на широком экране в ряд встаёт столько плиток, сколько помещается, как у
   * Stake и 1Win. Верхнего предела у 1fr нет, но шаг в 150 точек на
   * контейнере 1200 даёт семь колонок по ~165, и плитка остаётся плиткой.
   */
  .grid {
    display: grid; gap: var(--gap);
    grid-template-columns: repeat(auto-fill, minmax(var(--tile-min), 1fr));
  }
  @container (max-width: 560px) {
    .grid { grid-template-columns: repeat(3, 1fr); --gap: 10px; }
  }
  .tile {
    display: block; padding: 0; border: 0; background: none; cursor: pointer; text-align: left;
    min-width: 0;
  }
  /* block обязателен: .art - span внутри кнопки, а у строчного элемента
     aspect-ratio не действует, и плитка схлопывается в ноль. */
  .art {
    display: block;
    position: relative; overflow: hidden; border-radius: 14px;
    aspect-ratio: 3 / 4;
    background: var(--panel-2);
    box-shadow: 0 0 0 1px var(--line), 0 6px 16px rgba(0, 0, 0, 0.35);
    transition: transform .18s cubic-bezier(.2, .8, .3, 1), box-shadow .18s;
  }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Запасная обложка горизонтальная: её не режем под 3:4, а ставим целиком
     поверх размытой копии самой себя. Обрезка съела бы название игры. */
  .art.is-wide .blur { filter: blur(14px) saturate(1.3) brightness(.7); transform: scale(1.2); }
  .art.is-wide .fit { object-fit: contain; }
  .art::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), transparent 30%);
    pointer-events: none;
  }
  .badge {
    position: absolute; left: 6px; top: 6px; z-index: 2;
    padding: 3px 7px; border-radius: 8px;
    font-size: 10px; font-weight: 800; letter-spacing: .02em;
    background: rgba(13, 7, 22, 0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    color: var(--gold); box-shadow: inset 0 0 0 1px rgba(255, 211, 77, 0.35);
  }
  .hover {
    position: absolute; inset: 0; z-index: 3;
    display: grid; place-items: center; align-content: center; gap: 8px;
    background: rgba(13, 7, 22, 0.55);
    opacity: 0; transition: opacity .18s;
  }
  .play {
    width: 52px; height: 52px; border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(180deg, #ffe58a, #f2b230);
    box-shadow: 0 6px 18px rgba(242, 178, 48, 0.45);
  }
  .hover small { font-weight: 800; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #fff; }
  @media (hover: hover) {
    .tile:hover .art { transform: translateY(-4px); box-shadow: 0 0 0 1px rgba(236, 72, 153, 0.5), 0 14px 26px rgba(0, 0, 0, 0.5); }
    .tile:hover .hover { opacity: 1; }
  }
  .tile:active .art { transform: scale(.97); }
  .name {
    display: block; margin-top: 7px;
    font-size: 12.5px; font-weight: 700; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Имени провайдера под плиткой нет: страница и так одного провайдера, а на
     самих обложках Pragmatic он уже вписан в рисунок. */

  .more { margin-top: 18px; display: grid; justify-items: center; gap: 10px; }
  .progress { width: min(260px, 70%); height: 4px; border-radius: 2px; background: var(--panel-2); overflow: hidden; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--pink), var(--violet)); }
  .more small { color: var(--muted); font-size: 12px; font-weight: 700; }
  .more button {
    height: 44px; padding: 0 22px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2); font-weight: 800;
  }

  .others { margin-top: 26px; }
  .others h3 { margin: 0 0 10px; font: 800 14px/1 'Unbounded', 'Manrope', sans-serif; }
  .prow { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .prow::-webkit-scrollbar { display: none; }
  .pcard {
    flex: 0 0 auto; padding: 10px 14px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line);
  }
  .pcard b { display: block; font-size: 13px; }
  .pcard span { color: var(--muted); font-size: 11px; font-weight: 700; }

  /* ---------- Окно запуска ---------- */
  .launch { position: fixed; inset: 0; z-index: 40; display: grid; place-items: end center; }
  .launch[hidden] { display: none; }
  .launch-dim { position: absolute; inset: 0; background: rgba(5, 2, 10, 0.7); }
  .sheet {
    position: relative; width: min(100%, 460px); margin: 0 auto;
    border-radius: 22px 22px 0 0; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line);
    animation: up .28s cubic-bezier(.2, .8, .3, 1);
  }
  @media (min-width: 700px) { .launch { place-items: center; } .sheet { border-radius: 22px; } }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet-art { aspect-ratio: 1004 / 494; background: var(--panel-2) center / cover no-repeat; }
  .sheet-body { padding: 16px; }
  .sheet-body h4 { margin: 0; font: 800 18px/1.2 'Unbounded', 'Manrope', sans-serif; }
  .sheet-body p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .sheet-rtp {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px; padding: 10px 12px; border-radius: 12px;
    background: rgba(255, 211, 77, 0.08); box-shadow: inset 0 0 0 1px rgba(255, 211, 77, 0.25);
    font-size: 13px; font-weight: 700;
  }
  .sheet-rtp b { color: var(--gold); font: 800 16px/1 'Unbounded', 'Manrope', sans-serif; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 14px; }
  .sheet-actions button { flex: 1; height: 50px; border-radius: 14px; cursor: pointer; font-weight: 800; font-size: 15px; }
  .btn-gold { border: 0; color: #3a1d00; background: linear-gradient(180deg, #ffe58a, #f2b230); box-shadow: 0 4px 0 #b07613; }
  .btn-quiet { border: 1px solid var(--line); background: var(--panel-2); }

  /* ---------- Пояснение к макету: форматы обложек ---------- */
  .notes { max-width: 1240px; margin: 34px auto 0; }
  .notes h2 { font: 800 16px/1.2 'Unbounded', 'Manrope', sans-serif; margin: 0 0 6px; }
  .notes > p { color: var(--muted); margin: 0 0 14px; max-width: 760px; }
  .formats { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .fmt { padding: 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
  .fmt-art { height: 150px; display: grid; place-items: center; border-radius: 10px; background: var(--panel-2); overflow: hidden; }
  .fmt-art img { max-width: 100%; max-height: 100%; display: block; border-radius: 6px; }
  .fmt b { display: block; margin-top: 10px; }
  .fmt code { font: 600 12px 'SFMono-Regular', ui-monospace, Menlo, monospace; color: var(--pink); }
  .fmt span { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .fmt .use { color: var(--text); font-weight: 700; }
</style>
</head>
<body>
  <div class="review">
    <div>
      <b>Казино · страница провайдера</b>
      <small>Макет на согласование. Обложки и названия из каталога агрегатора.</small>
    </div>
    <div class="seg" role="group" aria-label="Вид">
      <button id="vPhone" aria-pressed="false">Телефон</button>
      <button id="vDesk" aria-pressed="true">Компьютер</button>
    </div>
  </div>

  <div class="stage">
    <div class="device">
      <div class="app">
        <div class="topbar">
          <div class="brand">LUCKY<span>BOX</span></div>
          <div class="balance">12 450 ₽</div>
        </div>
        <div class="content">
          <div class="crumbs"><span>Казино</span><i>›</i><span>Провайдеры</span><i>›</i><b id="crumbName"></b></div>

          <div class="hero">
            <div class="mono" id="mono"></div>
            <div>
              <h1 id="provName"></h1>
              <p id="provSub"></p>
            </div>
            <div class="rtp">отдача<b id="provRtp"></b></div>
          </div>

          <div class="tools">
            <label class="search">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="q" type="search" placeholder="Найти игру" autocomplete="off">
            </label>
            <div class="chips" role="group" aria-label="Порядок">
              <button class="chip" data-sort="pop" aria-pressed="true">Популярные</button>
              <button class="chip" data-sort="az" aria-pressed="false">А-Я</button>
            </div>
          </div>

          <div class="count-line"><h2>Все игры</h2><span id="shown"></span></div>
          <div class="grid" id="grid"></div>

          <div class="more">
            <div class="progress"><i id="bar"></i></div>
            <small id="moreText"></small>
            <button type="button">Показать ещё</button>
          </div>

          <div class="others">
            <h3>Другие провайдеры</h3>
            <div class="prow" id="others"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="notes">
      <h2>Какие обложки отдаёт API</h2>
      <p id="notesText"></p>
      <div class="formats" id="formats"></div>
    </div>
  </div>

  <div class="launch" id="launch" hidden>
    <div class="launch-dim" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-art" id="sheetArt"></div>
      <div class="sheet-body">
        <h4 id="sheetName"></h4>
        <p id="sheetProv"></p>
        <div class="sheet-rtp"><span>Отдача в этой игре</span><b id="sheetRtp"></b></div>
        <div class="sheet-actions">
          <button class="btn-quiet" data-close>Демо</button>
          <button class="btn-gold" data-close>Играть</button>
        </div>
      </div>
    </div>
  </div>

<script>
  const DATA = /*DATA*/;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const plural = (n, a, b, c) => {
    const m10 = n % 10, m100 = n % 100;
    return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c;
  };
  const P = DATA.provider;

  $('crumbName').textContent = P.name;
  $('provName').textContent = P.name;
  $('mono').textContent = P.name.split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
  $('provSub').textContent = `${P.count.toLocaleString('ru-RU')} ${plural(P.count, 'игра', 'игры', 'игр')} · есть демо`;
  $('provRtp').textContent = `${DATA.rtp}%`;
  $('sheetRtp').textContent = `${DATA.rtp}%`;

  function tileHtml(t, i) {
    const art = t.vertical
      ? `<img src="${t.cover}" alt="" loading="lazy">`
      : `<img class="blur" src="${t.cover}" alt=""><img class="fit" src="${t.cover}" alt="" loading="lazy">`;
    return `<button class="tile" data-i="${i}">
      <span class="art${t.vertical ? '' : ' is-wide'}">
        ${art}
        ${t.freespin ? '<span class="badge">FS</span>' : ''}
        <span class="hover">
          <span class="play"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#3a1d00"/></svg></span>
          <small>${t.demo ? 'Играть · демо' : 'Играть'}</small>
        </span>
      </span>
      <span class="name">${esc(t.name)}</span>
    </button>`;
  }

  let sort = 'pop';
  function render() {
    const q = $('q').value.trim().toLowerCase();
    let list = DATA.tiles.map((t, i) => ({ t, i })).filter(({ t }) => t.name.toLowerCase().includes(q));
    if (sort === 'az') list = list.slice().sort((a, b) => a.t.name.localeCompare(b.t.name, 'ru'));
    $('grid').innerHTML = list.map(({ t, i }) => tileHtml(t, i)).join('');
    const shown = list.length;
    $('shown').textContent = `${shown} из ${P.count.toLocaleString('ru-RU')}`;
    $('moreText').textContent = `Показано ${shown} из ${P.count.toLocaleString('ru-RU')}`;
    $('bar').style.width = `${Math.max(2, (shown / P.count) * 100)}%`;
  }
  render();
  $('q').addEventListener('input', render);
  document.querySelectorAll('[data-sort]').forEach((b) => b.addEventListener('click', () => {
    sort = b.dataset.sort;
    document.querySelectorAll('[data-sort]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    render();
  }));

  $('grid').addEventListener('click', (e) => {
    const tile = e.target.closest('.tile');
    if (!tile) return;
    const t = DATA.tiles[Number(tile.dataset.i)];
    $('sheetArt').style.backgroundImage = `url("${t.wide || t.cover}")`;
    $('sheetName').textContent = t.name;
    $('sheetProv').textContent = P.name;
    $('launch').hidden = false;
  });
  $('launch').addEventListener('click', (e) => { if (e.target.closest('[data-close]')) $('launch').hidden = true; });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('launch').hidden = true; });

  $('others').innerHTML = DATA.others.map((p) =>
    `<div class="pcard"><b>${esc(p.name)}</b><span>${p.count.toLocaleString('ru-RU')} ${plural(p.count, 'игра', 'игры', 'игр')}</span></div>`).join('');

  const C = DATA.coverage;
  $('notesText').textContent =
    `У каждой игры до четырёх картинок. Для сетки берём вертикальную 3:4, она есть у ${C.vertical}% игр каталога; ` +
    `где её нет, плитка показывает основную горизонтальную целиком, поверх её же размытой копии (последняя плитка в сетке). ` +
    `Широкая есть у ${C.wide}% и идёт в окно запуска. На своём сервере обложки будем пережимать до ~300 точек: ` +
    `вертикальная у части игр 590x790 и весит до 100 КБ, это много для сетки на телефоне.`;
  $('formats').innerHTML = DATA.formats.map((f) => `
    <div class="fmt">
      <div class="fmt-art"><img src="${f.uri}" alt=""></div>
      <b>${esc(f.label)} <code>${esc(f.field)}</code></b>
      <span>${f.ext.toUpperCase()} · ${f.kb} КБ</span>
      <span class="use">${esc(f.use)}</span>
    </div>`).join('');
  // Размеры дописываются после загрузки: в каталоге их нет, только ссылки.
  document.querySelectorAll('.fmt img').forEach((img, i) => {
    const put = () => { img.closest('.fmt').querySelector('span').textContent =
      `${img.naturalWidth}x${img.naturalHeight} · ${DATA.formats[i].ext.toUpperCase()} · ${DATA.formats[i].kb} КБ`; };
    img.complete ? put() : img.addEventListener('load', put);
  });

  // Вид: телефон или компьютер. Запоминать не нужно, это макет.
  const setView = (phone) => {
    document.body.classList.toggle('is-phone', phone);
    $('vPhone').setAttribute('aria-pressed', String(phone));
    $('vDesk').setAttribute('aria-pressed', String(!phone));
  };
  $('vPhone').addEventListener('click', () => setView(true));
  $('vDesk').addEventListener('click', () => setView(false));
</script>
</body>
</html>
