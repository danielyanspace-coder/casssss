  <button class="launch-retry" id="launchRetry" type="button">Попробовать снова</button>

 </div>

<script>
(function () {
 'use strict';
 const screen=document.getElementById('launchScreen');
 let finished=false;
 // Begin the two startup reads without waiting for the application module graph.
 const earlyResponses = window.__LB_STARTUP_RESPONSES = {
  '/api/config': fetch('/api/config',{cache:'no-store',headers:{'X-Case-Catalog':'summary'}}),
  '/api/me': fetch('/api/me',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:'{}'})
 };
 Object.values(earlyResponses).forEach(request=>request.catch(()=>{}));
 const shellRequest=fetch('/app-shell.html',{cache:'no-cache'});
 void import('/release-20261101-launch-guard/boot.js').catch(()=>{});
 const fail=()=>{
  if(finished)return;
  screen.classList.add('is-error');
  document.getElementById('launchStatus').textContent='Не удалось загрузить сайт. Проверьте соединение.';
 };
 const timeout=setTimeout(fail,45000);
 document.getElementById('launchRetry').onclick=()=>location.reload();
 const ready=new Promise((resolve,reject)=>{
  window.addEventListener('lb:ready',resolve,{once:true});
  window.addEventListener('lb:boot-error',()=>reject(new Error('startup failed')),{once:true});
 });
 ready.catch(()=>{});
 async function start(){
  performance.mark('lb:splash-painted');
  try{
   // These requests start only after the lightweight screen has painted.
   void import('/release-20261101-launch-guard/boot.js').catch(()=>{});
   const response=await shellRequest;
   if(!response.ok)throw new Error('page unavailable');
   const doc=new DOMParser().parseFromString(await response.text(),'text/html');
   const entry=doc.querySelector('script[data-app-entry], script[src^="/app.js"]')?.getAttribute('src');
   if(!entry||!doc.getElementById('app'))throw new Error('incomplete page');
   const styles=[];
   for(const original of doc.head.querySelectorAll('link')){
    const link=document.importNode(original,true);
    if(link.getAttribute('rel')==='stylesheet'&&link.media!=='print'){
     styles.push(new Promise((resolve,reject)=>{link.onload=resolve;link.onerror=reject;}));
    }
    document.head.append(link);
   }
   for(const script of doc.body.querySelectorAll('script'))script.remove();
   const fragment=document.createDocumentFragment();
   for(const node of [...doc.body.childNodes])fragment.append(document.importNode(node,true));
   document.body.append(fragment);
   await Promise.all([import(entry),ready,...styles]);
   const hero=document.querySelector('#hero img.active');
   if(hero?.decode)await Promise.race([hero.decode().catch(()=>{}),new Promise(resolve=>setTimeout(resolve,1200))]);
   finished=true;clearTimeout(timeout);performance.mark('lb:site-ready');
   document.documentElement.classList.remove('lb-launching');
   screen.classList.add('is-leaving');
   setTimeout(()=>screen.remove(),200);
  }catch(error){clearTimeout(timeout);fail();}
 }
 // Wait for an actual first paint where Paint Timing is available.
 // Safari falls back to decoded inline artwork and two frames plus a short task.
 let started=false;
 const begin=()=>{if(started)return;started=true;start();};
 const decoded=document.querySelector('.launch-logo').decode?.().catch(()=>{});
 Promise.resolve(decoded).then(()=>{
  if(typeof PerformanceObserver!=='undefined'&&PerformanceObserver.supportedEntryTypes?.includes('paint')){
   const observer=new PerformanceObserver(list=>{
    if(list.getEntries().some(e=>e.name==='first-contentful-paint')){observer.disconnect();begin();}
   });
   observer.observe({type:'paint',buffered:true});
   setTimeout(()=>{observer.disconnect();begin();},500);
  }else{
   requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(begin,32)));
  }
 });
})();
</script>
